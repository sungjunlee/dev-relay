evaluation:
  schema_version: 2
  outcome_contract:
    source: done_criteria
  verification:
    checks:
      - name: Required checkout states are reachable
        type: observation
        target: Success, validation failure, and recovery states render.
  observation:
    artifact: Checkout decision screen
    intended_user: A mobile shopper correcting a failed payment under time pressure.
    usage_context: The user must understand the failure without losing cart or payment context.
    surfaces:
      - kind: rendered_output
        target: /checkout/payment
        user_flows:
          - Failed payment to corrected payment
          - Validation error to retained input
        viewports:
          - 390x844
          - 1440x900
    inquiry:
      contract_satisfying_failure: Every required state could render while hierarchy and recovery remain confusing.
      expert_notice: A product designer would inspect scan order, state feedback, retained context, and product character.
    lenses:
      - name: design
        questions:
          - Is the next safe action obvious at each state?
          - Does hierarchy survive the relevant mobile and desktop viewports?
  earned_rubric:
    factors:
      - name: Recovery clarity
        evidence: Rendered failure flows expose whether state and next actions are understandable.
        eligibility:
          gradient: Complete flows can still range from confusing to self-explanatory.
          observable: The rendered failure and recovery states distinguish the levels.
          actionable: Lower results point to state feedback, hierarchy, or retained context.
          consequential: Confusion causes abandonment or duplicate payment attempts.
        anchors:
          weak: The failure state obscures what happened or what to do next.
          adequate: The state and one viable recovery action are understandable.
          strong: The state, consequence, and safest recovery path are immediately clear.
      - name: Responsive decision hierarchy
        evidence: The same payment decision is observed at mobile and desktop viewports.
        eligibility:
          gradient: Correct layouts can differ materially in scan order and action prominence.
          observable: Viewport captures distinguish flat, usable, and decisive hierarchy.
          actionable: Lower results point to grouping, order, or emphasis changes.
          consequential: Poor hierarchy slows or misdirects a payment decision.
        anchors:
          weak: Competing content hides the primary decision at a relevant viewport.
          adequate: The primary action is findable with deliberate scanning.
          strong: Priority and next action are obvious at a glance across viewports.
