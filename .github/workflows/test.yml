name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.suite }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: relay-ready
            runner: ubuntu-latest
          - suite: relay-plan
            runner: ubuntu-latest
          - suite: relay-dispatch
            runner: macos-latest
          - suite: relay-review
            runner: ubuntu-latest
          - suite: relay-merge
            runner: macos-latest
          - suite: relay
            runner: ubuntu-latest
          - suite: relay-config
            runner: ubuntu-latest
          - suite: relay-fleet
            runner: ubuntu-latest
          - suite: skills-lint
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run test suites (${{ matrix.suite }})
        run: |
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find "tests/${{ matrix.suite }}/scripts" -type f -name '*.test.js' -print | LC_ALL=C sort)
          count=${#files[@]}
          echo "Matched $count test file(s)"
          if [ "$count" -eq 0 ]; then
            echo "::error::No test files matched the suite globs; refusing vacuous CI pass"
            exit 1
          fi
          node --test --test-concurrency=1 "${files[@]}"

  native-first-linux:
    name: native-first Linux production seams
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise direct host, dispatch, recover, and review seams
        run: >-
          node --test --test-concurrency=1
          tests/relay-dispatch/scripts/host-supervisor.test.js
          tests/relay-dispatch/scripts/run-store.test.js
          tests/relay-dispatch/scripts/dispatch.test.js
          tests/relay-dispatch/scripts/inspect-recover-blackbox.test.js
          tests/relay-dispatch/scripts/relay-recover-cli.test.js
          tests/relay-review/scripts/review-runner.test.js
